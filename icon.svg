<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3350"/>
      <stop offset="1" stop-color="#0f1115"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b93ff"/>
      <stop offset="1" stop-color="#4f7cff"/>
    </linearGradient>
  </defs>

  <!-- rounded app tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- metronome body (trapezoid) -->
  <path d="M256 96 L346 400 L166 400 Z" fill="url(#body)"/>

  <!-- scale slot -->
  <rect x="248" y="150" width="16" height="210" rx="8" fill="#0f1115" opacity="0.55"/>

  <!-- pendulum -->
  <g stroke="#0f1115" stroke-width="14" stroke-linecap="round" opacity="0.85">
    <line x1="256" y1="356" x2="316" y2="150"/>
  </g>
  <circle cx="316" cy="150" r="20" fill="#ff5a5f"/>
  <circle cx="256" cy="356" r="14" fill="#0f1115" opacity="0.7"/>

  <!-- base -->
  <rect x="150" y="400" width="212" height="30" rx="12" fill="#5b7be0"/>
</svg>
